[project]
name = "aniworld-verlauf"
version = "1.0.0"
description = "Exportiert den AniWorld-Verlauf (account/watched 1..n) nach CSV + JSON."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=0.21",
    "colorama>=0.4.6",
]

# Reines Skript-Projekt (kein installierbares Paket) -> uv installiert nur die
# Dependencies. Der primäre Weg bleibt weiterhin venv + pip -r requirements.txt.
[tool.uv]
package = false

[project.optional-dependencies]
browser = ["playwright>=1.40"]